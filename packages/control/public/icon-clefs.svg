<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Service Maestro clef monogram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.55" stop-color="#0d2638"/>
      <stop offset="1" stop-color="#123a52"/>
    </linearGradient>
    <linearGradient id="treble" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#c9f4ff"/>
      <stop offset="1" stop-color="#35bdf0"/>
    </linearGradient>
    <linearGradient id="bass" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.4" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f3a22f"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="415" cy="92" r="96" fill="#36b9ec" opacity="0.10"/>
  <circle cx="92" cy="430" r="118" fill="#f3a22f" opacity="0.07"/>

  <!-- two five-line staves -->
  <g stroke="#9fe8ff" stroke-width="2.8" stroke-linecap="round" opacity="0.26">
    <path d="M44 208h196"/><path d="M44 236h196"/><path d="M44 264h196"/>
    <path d="M44 292h196"/><path d="M44 320h196"/>
    <path d="M272 208h196"/><path d="M272 236h196"/><path d="M272 264h196"/>
    <path d="M272 292h196"/><path d="M272 320h196"/>
  </g>

  <!-- S as a bold, spiralling treble clef -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M181 101
             C 139 99 111 132 117 171
             C 124 215 171 236 201 210
             C 235 180 217 135 181 135
             C 137 135 107 182 115 231
             C 125 294 178 336 193 378
             C 202 406 187 430 162 423
             C 137 416 130 389 146 371"
          stroke="#04111c" stroke-width="34"/>
    <path d="M181 101
             C 139 99 111 132 117 171
             C 124 215 171 236 201 210
             C 235 180 217 135 181 135
             C 137 135 107 182 115 231
             C 125 294 178 336 193 378
             C 202 406 187 430 162 423
             C 137 416 130 389 146 371"
          stroke="url(#treble)" stroke-width="18"/>
  </g>

  <!-- M shaped from two bass-clef curves, with the bass-clef dots -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 368
             C 292 286 302 224 332 181
             C 359 219 370 284 370 368
             M370 368
             C 370 284 381 219 408 181
             C 438 224 448 286 448 368"
          stroke="#04111c" stroke-width="48"/>
    <path d="M292 368
             C 292 286 302 224 332 181
             C 359 219 370 284 370 368
             M370 368
             C 370 284 381 219 408 181
             C 438 224 448 286 448 368"
          stroke="url(#bass)" stroke-width="26"/>
  </g>
  <g fill="#ffe08a" filter="url(#glow)">
    <circle cx="463" cy="238" r="9"/>
    <circle cx="463" cy="274" r="9"/>
  </g>

  <!-- subtle highlight sweep to keep the marks bright -->
  <path d="M72 392c64 30 132 40 192 22 53-16 97-45 159-30" fill="none" stroke="#8be9ff" stroke-width="7" stroke-linecap="round" opacity="0.28"/>
</svg>

name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install application dependencies
        run: npm ci

      - name: Build desktop packages
        run: python3 packaging/desktop/build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-maestro-desktop
          path: |
            dist/desktop/ServiceMaestro-windows-x64.zip
            dist/desktop/ServiceMaestro-macos-arm64.zip
            dist/desktop/ServiceMaestro-macos-x64.zip
          if-no-files-found: error

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/desktop/ServiceMaestro-windows-x64.zip
            dist/desktop/ServiceMaestro-macos-arm64.zip
            dist/desktop/ServiceMaestro-macos-x64.zip

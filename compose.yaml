services:
  service-maestro:
    build: .
    image: service-maestro:dev
    container_name: service-maestro
    restart: unless-stopped
    ports:
      - "6111:8080"
    environment:
      WLM_TZ: Europe/London
      WLM_ADMIN_PASSWORD: ${WLM_ADMIN_PASSWORD:-change-me}
      WLM_OUTPUT_TOKEN: ${WLM_OUTPUT_TOKEN:-dev-output}
      WLM_SONGS_DIR: /library/songs
      WLM_BIBLE_DIR: /library/bible
      WLM_CHURCHSUITE_CLIENT_ID: ${WLM_CHURCHSUITE_CLIENT_ID:-}
      WLM_CHURCHSUITE_CLIENT_SECRET: ${WLM_CHURCHSUITE_CLIENT_SECRET:-}
      WLM_CHURCHSUITE_TOKEN_URL: ${WLM_CHURCHSUITE_TOKEN_URL:-https://login.churchsuite.com/oauth2/token}
      WLM_CHURCHSUITE_SCOPES: ${WLM_CHURCHSUITE_SCOPES:-planning.read}
      WLM_CHURCHSUITE_API_URL: ${WLM_CHURCHSUITE_API_URL:-https://api.churchsuite.com/v2}
    volumes:
      - ./data:/data
      - ./library/songs:/library/songs:ro
      - ./library/bible:/library/bible:ro
      - ./library/images:/library/images
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0

services:
  service-maestro:
    build: .
    image: service-maestro:dev
    container_name: service-maestro
    restart: unless-stopped
    ports:
      - "6111:${SM_PORT:-8080}"
      - "6112:${SM_DISPLAY_PORT:-8081}"
    environment:
      SM_TZ: Europe/London
      SM_PORT: ${SM_PORT:-8080}
      SM_DISPLAY_PORT: ${SM_DISPLAY_PORT:-8081}
      SM_ADMIN_PASSWORD: ${SM_ADMIN_PASSWORD:-change-me}
      SM_OUTPUT_TOKEN: ${SM_OUTPUT_TOKEN:-dev-output}
      SM_CONFIG_FILE: ${SM_CONFIG_FILE:-}
      SM_SSL_ENABLED: ${SM_SSL_ENABLED:-true}
      SM_SSL_DIR: ${SM_SSL_DIR:-/data/ssl}
      SM_SSL_CERT_FILE: ${SM_SSL_CERT_FILE:-}
      SM_SSL_KEY_FILE: ${SM_SSL_KEY_FILE:-}
      SM_SSL_HOSTS: ${SM_SSL_HOSTS:-}
      SM_SONGS_DIR: /library/songs
      SM_BIBLE_DIR: /library/bible
      SM_IMAGES_DIR: /library/images
      SM_CHURCHSUITE_CLIENT_ID: ${SM_CHURCHSUITE_CLIENT_ID:-}
      SM_CHURCHSUITE_CLIENT_SECRET: ${SM_CHURCHSUITE_CLIENT_SECRET:-}
      SM_CHURCHSUITE_TOKEN_URL: ${SM_CHURCHSUITE_TOKEN_URL:-https://login.churchsuite.com/oauth2/token}
      SM_CHURCHSUITE_SCOPES: ${SM_CHURCHSUITE_SCOPES:-planning.read}
      SM_CHURCHSUITE_API_URL: ${SM_CHURCHSUITE_API_URL:-https://api.churchsuite.com/v2}
      SM_GIT_ENABLED: ${SM_GIT_ENABLED:-true}
      SM_GIT_AUTO_SAVE: ${SM_GIT_AUTO_SAVE:-true}
      SM_GIT_AUTO_PUSH: ${SM_GIT_AUTO_PUSH:-true}
      SM_GIT_PULL_INTERVAL: ${SM_GIT_PULL_INTERVAL:-60}
      SM_GIT_SONGS_REMOTE: ${SM_GIT_SONGS_REMOTE:-}
      SM_GIT_SONGS_BRANCH: ${SM_GIT_SONGS_BRANCH:-}
      SM_GIT_SONGS_REMOTE_BRANCH: ${SM_GIT_SONGS_REMOTE_BRANCH:-}
      SM_GIT_SETLISTS_REMOTE: ${SM_GIT_SETLISTS_REMOTE:-}
      SM_GIT_SETLISTS_BRANCH: ${SM_GIT_SETLISTS_BRANCH:-}
      SM_GIT_SETLISTS_REMOTE_BRANCH: ${SM_GIT_SETLISTS_REMOTE_BRANCH:-}
      SM_GIT_SETLIST_REMOTE_BRANCH: ${SM_GIT_SETLIST_REMOTE_BRANCH:-}
      SM_GIT_BIBLES_REMOTE: ${SM_GIT_BIBLES_REMOTE:-}
      SM_GIT_BIBLES_BRANCH: ${SM_GIT_BIBLES_BRANCH:-}
      SM_GIT_TEMPLATES_REMOTE: ${SM_GIT_TEMPLATES_REMOTE:-}
      SM_GIT_TEMPLATES_BRANCH: ${SM_GIT_TEMPLATES_BRANCH:-}
    volumes:
      - ./data:/data
      - ./library/songs:/library/songs:ro
      - ./library/bible:/library/bible:ro
      - ./library/images:/library/images
      # Optional: mount a structured config and set SM_CONFIG_FILE=/config/config.yaml
      # - ./config.yaml:/config/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
